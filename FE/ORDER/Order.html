<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>
<link rel="stylesheet" href="../ORDER/Order.css" />

<div class="order-container">
  <div class="order-header">
    <div class="header-left">
      <span class="total-summary"
        >Tổng đơn: <strong id="total-count">0</strong></span
      >
      <button class="btn-add" onclick="openAddOrder()">
        <i class="fa-solid fa-plus"></i> Thêm đơn
      </button>
    </div>

    <div class="header-right"></div>
  </div>
</div>

<div class="order-grid" id="orderContainer"></div>

<!-- Overlay for Add Order -->
<div
  id="addOrderWrapper"
  class="add-order-overlay"
  onclick="if (event.target === this) closeAddOrder();"
>
  <div class="add-order-box">
    <div id="addOrderContent"></div>
  </div>
</div>

<script src="../ORDER/Order.js"></script>
