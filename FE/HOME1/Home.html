<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Quán Cà Phê</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brown-dark: #4a2c17;
        --brown-mid: #7b4a2b;
        --brown-light: #c8956a;
        --cream: #fdf6ed;
        --cream-card: #fffaf4;
        --cream-border: #e8d5be;
        --text-dark: #2d1a0e;
        --text-mid: #6b4226;
        --shadow: 0 4px 18px rgba(74, 44, 23, 0.1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Be Vietnam Pro", sans-serif;
        background: var(--cream);
        min-height: 100vh;
        padding: 28px 20px 60px;
      }

      /* Top bar */
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
        flex-wrap: wrap;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        background: white;
        border: 1.5px solid var(--cream-border);
        border-radius: 10px;
        padding: 9px 14px;
        flex: 1;
        min-width: 180px;
        box-shadow: var(--shadow);
      }
      .search-box input {
        border: none;
        outline: none;
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 14px;
        color: var(--text-dark);
        background: transparent;
        width: 100%;
      }
      .search-box input::placeholder {
        color: #bca48a;
      }
      .search-icon {
        color: #bca48a;
        font-size: 15px;
      }

      .filter-group {
        display: flex;
        align-items: center;
        background: white;
        border: 1.5px solid var(--cream-border);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .filter-btn {
        padding: 9px 16px;
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        background: transparent;
        color: var(--text-mid);
        transition: all 0.18s;
        border-right: 1px solid var(--cream-border);
      }
      .filter-btn:last-child {
        border-right: none;
      }
      .filter-btn.active,
      .filter-btn:hover {
        background: var(--brown-dark);
        color: white;
      }

      .btn-new-order {
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--brown-dark);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 9px 18px;
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: var(--shadow);
        transition:
          background 0.18s,
          transform 0.12s;
        white-space: nowrap;
      }
      .btn-new-order:hover {
        background: var(--brown-mid);
        transform: translateY(-1px);
      }

      /* Grid */
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }

      /* Card */
      .card {
        background: var(--cream-card);
        border: 1.5px solid var(--cream-border);
        border-radius: 18px;
        padding: 18px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition:
          transform 0.18s,
          box-shadow 0.18s;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(74, 44, 23, 0.13);
      }

      .card-header {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .card-icon {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: var(--cream);
        border: 1.5px solid var(--cream-border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        flex-shrink: 0;
      }

      .card-info {
        flex: 1;
      }
      .card-label {
        font-size: 11.5px;
        color: var(--brown-light);
        font-weight: 500;
        margin-bottom: 2px;
      }
      .card-name {
        font-family: "Playfair Display", serif;
        font-size: 15.5px;
        color: var(--text-dark);
        font-weight: 700;
        line-height: 1.3;
        margin-bottom: 3px;
      }
      .card-price {
        font-size: 14px;
        font-weight: 600;
        color: var(--brown-mid);
      }

      .card-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .btn-view,
      .btn-add {
        width: 100%;
        border: none;
        border-radius: 9px;
        padding: 9px 0;
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        transition: all 0.16s;
      }

      .btn-view {
        background: var(--brown-dark);
        color: white;
      }
      .btn-view:hover {
        background: #3a1f0e;
      }

      .btn-add {
        background: white;
        color: var(--brown-dark);
        border: 1.5px solid var(--cream-border);
      }
      .btn-add:hover {
        background: var(--cream);
        border-color: var(--brown-light);
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--brown-dark);
        color: white;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(74, 44, 23, 0.25);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 999;
        white-space: nowrap;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <!-- Top bar -->
    <div class="topbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          placeholder="Tìm kiếm..."
          oninput="filterMenu(this.value)"
        />
      </div>
      <div class="filter-group">
        <button class="filter-btn active" onclick="filterCat('all', this)">
          Tất cả
        </button>
        <button class="filter-btn" onclick="filterCat('banh', this)">
          Bánh
        </button>
        <button class="filter-btn" onclick="filterCat('caphe', this)">
          Cà phê
        </button>
        <button class="filter-btn" onclick="filterCat('tra', this)">Trà</button>
      </div>
      <button class="btn-new-order" onclick="newOrder()">＋ Tạo đơn mới</button>
    </div>

    <!-- Menu grid -->
    <div class="menu-grid" id="menuGrid"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
      const products = [
        {
          id: 1,
          name: "Bánh Cheesecake Chanh Dây",
          price: "45.000đ",
          icon: "🍰",
          cat: "banh",
          label: "Tên sản phẩm",
        },
        {
          id: 2,
          name: "Cà Phê Sữa Đá",
          price: "45.000đ",
          icon: "☕",
          cat: "caphe",
          label: "Tên sản phẩm",
        },
        {
          id: 3,
          name: "Cà Phê Sữa Đá",
          price: "45.000đ",
          icon: "🥤",
          cat: "caphe",
          label: "Tên sản phẩm",
        },
        {
          id: 4,
          name: "Bánh Cheesecake Chanh Dây",
          price: "45.000đ",
          icon: "🍰",
          cat: "banh",
          label: "Tên sản phẩm",
        },
        {
          id: 5,
          name: "Cà Phê Trà",
          price: "45.000đ",
          icon: "🥤",
          cat: "tra",
          label: "Tên sản phẩm",
        },
        {
          id: 6,
          name: "Cà Phê Sữa",
          price: "45.000đ",
          icon: "🥤",
          cat: "caphe",
          label: "Tên sản phẩm",
        },
        {
          id: 7,
          name: "Trà Đào Cam Sả",
          price: "40.000đ",
          icon: "🍑",
          cat: "tra",
          label: "Tên sản phẩm",
        },
        {
          id: 8,
          name: "Cà Phê Đen",
          price: "35.000đ",
          icon: "☕",
          cat: "caphe",
          label: "Tên sản phẩm",
        },
        {
          id: 9,
          name: "Bánh Su Kem",
          price: "30.000đ",
          icon: "🧁",
          cat: "banh",
          label: "Tên sản phẩm",
        },
      ];

      let currentCat = "all";
      let searchTerm = "";

      function renderMenu() {
        const grid = document.getElementById("menuGrid");
        const filtered = products.filter((p) => {
          const catMatch = currentCat === "all" || p.cat === currentCat;
          const searchMatch = p.name
            .toLowerCase()
            .includes(searchTerm.toLowerCase());
          return catMatch && searchMatch;
        });

        grid.innerHTML = filtered
          .map(
            (p) => `
    <div class="card" id="card-${p.id}">
      <div class="card-header">
        <div class="card-icon">${p.icon}</div>
        <div class="card-info">
          <div class="card-label">${p.label}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-price">${p.price}</div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn-view" onclick="viewProduct(${p.id})">👁 Xem</button>
        <button class="btn-add" onclick="addToOrder(${p.id}, '${p.name}')">＋ Thêm vào đơn</button>
      </div>
    </div>
  `,
          )
          .join("");
      }

      function filterCat(cat, btn) {
        currentCat = cat;
        document
          .querySelectorAll(".filter-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderMenu();
      }

      function filterMenu(val) {
        searchTerm = val;
        renderMenu();
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
      }

      function addToOrder(id, name) {
        showToast("✓ Đã thêm: " + name);
      }

      function viewProduct(id) {
        const p = products.find((x) => x.id === id);
        showToast("👁 Xem: " + p.name + " — " + p.price);
      }

      function newOrder() {
        showToast("📋 Đã tạo đơn hàng mới!");
      }

      renderMenu();
    </script>
  </body>
</html>
