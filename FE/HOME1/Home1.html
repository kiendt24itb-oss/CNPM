<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - CoffeeManager</title>
    <meta
      name="description"
      content="Hệ thống quản lý quán cà phê chuyên nghiệp"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              coffee: {
                50: "#faf6f3",
                100: "#f0e6de",
                200: "#e0ccbd",
                300: "#c9a88f",
                400: "#b08560",
                500: "#8b6914",
                600: "#5D4037",
                700: "#4E342E",
                800: "#3E2723",
                900: "#2d1f1a",
              },
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }

      /* Ẩn controls video */
      video::-webkit-media-controls {
        display: none !important;
      }
      video::-webkit-media-controls-enclosure {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-stone-50">
    <div class="flex min-h-screen">
      <!-- Left Side - Video Background -->
      <div class="relative hidden flex-1 lg:flex overflow-hidden">
        <!-- Video Background -->
        <video
          autoplay
          loop
          muted
          playsinline
          class="absolute inset-0 h-full w-full object-cover scale-105"
        >
          <source src="../../ASSETS/VIDEOS/coffe.mp4" type="video/mp4" />
        </video>

        <!-- Overlay gradient nâu -->
        <div
          class="absolute inset-0 bg-gradient-to-br from-coffee-800/70 via-coffee-700/60 to-coffee-900/80"
        ></div>

        <!-- Brand Content -->
        <div
          class="relative z-10 flex flex-col items-center justify-center p-10 text-white w-full"
        >
          <div
            class="mb-8 flex h-28 w-28 items-center justify-center rounded-3xl bg-white/15 backdrop-blur-md border border-white/20 shadow-2xl"
          >
            <img
              src="https://cdn-icons-png.flaticon.com/512/924/924514.png"
              alt="Coffee Logo"
              class="w-[72px] h-[72px] object-contain drop-shadow-lg"
            />
          </div>
          <h1 class="mb-4 text-4xl font-bold drop-shadow-lg">CoffeeManager</h1>
          <p
            class="max-w-xs text-center text-base leading-relaxed opacity-90 drop-shadow-md"
          >
            Hệ thống quản lý quán cà phê chuyên nghiệp, giúp bạn vận hành hiệu
            quả hơn
          </p>
        </div>
      </div>

      <!-- Right Side - Login Form -->
      <div
        class="flex flex-1 items-center justify-center bg-gradient-to-br from-stone-50 to-coffee-50 p-6 lg:p-10"
      >
        <div class="w-full max-w-md">
          <!-- Header -->
          <div class="mb-8">
            <h1 class="mb-2 text-3xl font-bold text-coffee-800">
              Chào mừng trở lại!
            </h1>
            <p class="text-coffee-600">
              Đăng nhập để tiếp tục quản lý quán của bạn
            </p>
          </div>

          <!-- Form -->
          <form id="loginForm" class="space-y-5">
            <div class="space-y-2">
              <label for="email" class="text-sm font-medium text-coffee-800">
                Email
              </label>
              <input
                id="email"
                type="email"
                placeholder="Nhập email của bạn"
                required
                class="w-full h-12 px-4 rounded-xl border-2 border-coffee-200 bg-white focus:border-coffee-600 focus:outline-none focus:ring-2 focus:ring-coffee-600/20 transition-all"
              />
            </div>

            <div class="space-y-2">
              <label for="password" class="text-sm font-medium text-coffee-800">
                Mật khẩu
              </label>
              <input
                id="password"
                type="password"
                placeholder="Nhập mật khẩu"
                required
                class="w-full h-12 px-4 rounded-xl border-2 border-coffee-200 bg-white focus:border-coffee-600 focus:outline-none focus:ring-2 focus:ring-coffee-600/20 transition-all"
              />
            </div>

            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <input
                  id="remember"
                  type="checkbox"
                  class="w-4 h-4 rounded border-coffee-400 text-coffee-600 focus:ring-coffee-600 cursor-pointer accent-coffee-600"
                />
                <label
                  for="remember"
                  class="cursor-pointer text-sm text-coffee-700"
                >
                  Ghi nhớ đăng nhập
                </label>
              </div>
              <a
                href="#"
                class="text-sm font-medium text-coffee-600 transition-colors hover:text-coffee-800 hover:underline"
              >
                Quên mật khẩu?
              </a>
            </div>

            <button
              type="submit"
              class="w-full h-12 rounded-xl bg-coffee-600 text-white text-base font-semibold transition-all hover:bg-coffee-700 hover:shadow-lg hover:shadow-coffee-600/30 cursor-pointer"
            >
              Đăng nhập
            </button>
          </form>

          <!-- Divider -->
          <div class="my-6 flex items-center gap-4">
            <div class="h-px flex-1 bg-coffee-200"></div>
            <span class="text-sm font-medium text-coffee-500">hoặc</span>
            <div class="h-px flex-1 bg-coffee-200"></div>
          </div>

          <!-- Google Login -->
          <button
            type="button"
            id="googleLoginBtn"
            class="w-full h-12 flex items-center justify-center gap-3 rounded-xl border-2 border-coffee-200 bg-white text-coffee-700 font-medium transition-all hover:bg-coffee-50 hover:border-coffee-300 cursor-pointer"
          >
            <img
              src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt="Google"
              class="w-[22px] h-[22px]"
            />
            Đăng nhập với Google
          </button>

          <!-- Sign Up Link -->
          <p class="mt-8 text-center text-sm text-coffee-600">
            Chưa có tài khoản?
            <a
              href="register.html"
              class="font-semibold text-coffee-700 transition-colors hover:text-coffee-800 hover:underline"
            >
              Đăng ký ngay
            </a>
          </p>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div
      id="toast"
      class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50"
    >
      <div
        class="bg-white rounded-xl shadow-xl border border-coffee-100 p-4 min-w-[300px]"
      >
        <h4 id="toastTitle" class="font-semibold text-coffee-800 mb-1"></h4>
        <p id="toastDesc" class="text-sm text-coffee-600"></p>
      </div>
    </div>

    <script>
      // Toast function
      function showToast(title, description, isError = false) {
        const toast = document.getElementById("toast");
        const toastTitle = document.getElementById("toastTitle");
        const toastDesc = document.getElementById("toastDesc");

        toastTitle.textContent = title;
        toastDesc.textContent = description;

        if (isError) {
          toastTitle.classList.add("text-red-600");
          toastTitle.classList.remove("text-coffee-800");
        } else {
          toastTitle.classList.remove("text-red-600");
          toastTitle.classList.add("text-coffee-800");
        }

        toast.classList.remove(
          "translate-y-20",
          "opacity-0",
          "pointer-events-none",
        );
        toast.classList.add("translate-y-0", "opacity-100");

        setTimeout(() => {
          toast.classList.add(
            "translate-y-20",
            "opacity-0",
            "pointer-events-none",
          );
          toast.classList.remove("translate-y-0", "opacity-100");
        }, 3000);
      }

      // Login form handler
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          if (email && password) {
            showToast("Đăng nhập thành công!", "Chào mừng bạn trở lại.");
            // Redirect logic here
            // window.location.href = 'dashboard.html';
          } else {
            showToast("Lỗi đăng nhập", "Email hoặc mật khẩu không đúng!", true);
          }
        });

      // Google login handler
      document
        .getElementById("googleLoginBtn")
        .addEventListener("click", function () {
          showToast("Đang kết nối...", "Đang kết nối với Google.");
          // Google OAuth logic here
        });
    </script>
  </body>
</html>
