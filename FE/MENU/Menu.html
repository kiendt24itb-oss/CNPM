<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
/>
<link rel="stylesheet" href="../MENU/Menu.css" />

<div class="menu-container">
  <!-- Header -->
  <div class="header-row">
    <div class="stat-item">
      <span class="stat-label">Tổng số món:</span>
      <span class="stat-value" id="totalProducts">13</span>
    </div>

    <button class="btn-add-product" onclick="addProduct()">
      + Thêm sản phẩm
    </button>

    <div class="header-right">
      <button class="btn-recipe" onclick="openFormula()">
        Thiết lập công thức
      </button>
    </div>
  </div>

  <!-- Product Grid -->
  <div class="product-grid" id="productGrid"></div>
</div>

<!-- ✅ OVERLAY FOR ADD PRODUCT -->
<div
  id="addProductWrapper"
  class="add-product-overlay"
  onclick="if (event.target === this) closeAddProduct();"
>
  <div class="add-product-box">
    <div id="addProductContent"></div>
  </div>
</div>

<!-- ✅ OVERLAY FOR FORMULA -->
<div id="formulaWrapper" class="formula-overlay">
  <div class="formula-box">
    <div id="formulaContent"></div>
  </div>
</div>

<script src="../MENU/Menu.js"></script>
