<link rel="stylesheet" href="../HOME/Home.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="stats-grid">
  <div class="chart-card">
    <h3
      style="color: var(--primary-color); margin-bottom: 20px; font-size: 18px"
    >
      Doanh thu theo ngày
    </h3>
    <div class="chart-container">
      <canvas id="revenueChart"></canvas>
    </div>
  </div>

  <div class="card">
    <div class="card-icon">💰</div>
    <h3>Doanh thu hôm nay</h3>
    <div id="todayRevenue" class="number">--</div>
    <div id="revenueTrend" class="trend">--</div>
  </div>

  <div class="card">
    <div class="card-icon">📝</div>
    <h3>Đơn hàng mới</h3>
    <div id="newOrders" class="number">--</div>
    <div id="orderTrend" class="trend">--</div>
  </div>

  <div class="card">
    <div class="card-icon">👥</div>
    <h3>Tổng nhân viên</h3>
    <div id="totalStaff" class="number">--</div>
    <div id="staffStatus" class="trend">--</div>
  </div>

  <div class="card">
    <div class="card-icon">🪑</div>
    <h3>Bàn trống</h3>
    <div id="tableStatus" class="number">--</div>
    <div class="progress-bar">
      <div id="tableProgress" class="progress-fill" style="width: 0%"></div>
    </div>
    <div
      id="tablePercent"
      class="trend"
      style="color: var(--success-color); font-size: 13px"
    >
      --
    </div>
  </div>

  <div class="card">
    <div class="card-icon">👥</div>
    <h3>Khách hàng</h3>
    <div id="customerCount" class="number">--</div>
    <div id="customerTrend" class="trend">--</div>
  </div>

  <div class="card">
    <div class="card-icon">📦</div>
    <h3>Nguyên liệu sắp hết</h3>
    <div id="lowStock" class="number">--</div>
    <div class="trend" style="color: var(--warning-color)">⚠️ Cần nhập kho</div>
  </div>
</div>

<div class="content-grid">
  <div class="panel">
    <div class="panel-header">
      <h3>Đơn hàng gần đây</h3>
    </div>
  </div>
</div>

<script src="../HOME/Home.js"></script>
