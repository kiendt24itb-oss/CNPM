<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
/>
<link rel="stylesheet" href="../TABLE/Table.css" />

<div class="menu-container">
  <div class="header-row">
    <div class="stat-item">
      <span class="stat-label">Tổng số bàn:</span>
      <span class="stat-value" id="totalTables">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Bàn đang dùng:</span>
      <span class="stat-value" id="occupiedTables" style="color: #c62828"
        >0</span
      >
    </div>
    <button class="btn-add-table" onclick="addTable()">
      <span class="icon-add"></span>
      Thêm bàn mới
    </button>

    <div class="header-right"></div>
  </div>

  <div class="table-grid" id="tableGrid"></div>
</div>

<!-- Overlay for Add Table (same behavior like Order) -->
<div
  id="addTableWrapper"
  class="add-table-overlay"
  onclick="if (event.target === this) closeAddTable();"
>
  <div class="add-table-box">
    <div id="addTableContent"></div>
  </div>
</div>

<script src="../TABLE/Table.js"></script>
