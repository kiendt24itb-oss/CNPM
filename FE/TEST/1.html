<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giao diện Thêm Sản Phẩm - Coffee Style</title>
    <style>
      :root {
        --coffee-main: #634832;
        --coffee-light: #fdfaf8;
        --coffee-border: #a68b7c;
        --coffee-placeholder: #b29e8f;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: var(--coffee-main);
      }

      .modal-container {
        background-color: white;
        width: 700px;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      }

      .modal-header {
        background-color: var(--coffee-main);
        color: white;
        text-align: center;
        padding: 18px;
        font-size: 22px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .modal-body {
        padding: 30px;
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 40px;
        align-items: start; /* Căn lề trên để các cột không tự co giãn theo nhau */
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
      }

      /* CSS KHUNG ẢNH MỚI */
      .upload-area {
        border: 2px dashed var(--coffee-border);
        border-radius: 12px;
        height: 250px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        background-color: var(--coffee-light);
        position: relative;
        overflow: hidden;
        transition: 0.3s;
      }

      .upload-area:hover {
        border-color: var(--coffee-main);
        background-color: #f5eee8;
      }

      #previewImage {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
        position: absolute;
      }

      /* ĐỒNG BỘ TẤT CẢ INPUT/SELECT/TEXTAREA */
      input,
      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: 1.5px solid #dcd0c6;
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        color: var(--coffee-main);
        background-color: white;
        outline: none;
        box-sizing: border-box; /* Giữ input nằm gọn trong khung */
        margin-top: 5px; /* Tạo khoảng cách nhỏ với label */
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--coffee-main);
      }

      /* Màu cho placeholder (chữ ví dụ) */
      ::placeholder {
        color: var(--coffee-placeholder);
        opacity: 1;
      }

      /* Khử màu xanh mặc định của dropdown khi chọn (tùy trình duyệt) */
      select option {
        background-color: white;
        color: var(--coffee-main);
      }

      textarea {
        height: 100px;
        resize: none;
      }

      .modal-footer {
        padding: 15px 25px;
        display: flex;
        justify-content: flex-end;
        gap: 15px;
        border-top: 1px solid #f0e6dd;
      }

      /* NÚT HỦY THEO HÌNH MẪU */
      .btn-cancel {
        color: var(--coffee-main);
        background: white;
        border: 1.5px solid #d32f2f; /* Viền đỏ */
        padding: 10px 20px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.2s;
      }

      .btn-cancel:hover {
        background-color: #fff5f5; /* Nền đỏ cực nhạt */
        border-color: #b71c1c; /* Viền đỏ đậm hơn */
        color: #b71c1c;
      }

      /* Đổi màu chữ cho các option bên trong */
      select option {
        background-color: white;
        color: var(--coffee-main);
        padding: 10px;
      }

      /* Icon X thanh mảnh */
      .close-icon {
        width: 14px;
        height: 14px;
        position: relative;
        display: inline-block;
      }
      .close-icon::before,
      .close-icon::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 2px;
        background-color: currentColor;
        top: 6px;
        left: 0;
      }
      .close-icon::before {
        transform: rotate(45deg);
      }
      .close-icon::after {
        transform: rotate(-45deg);
      }

      .btn-save {
        background-color: var(--coffee-main);
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-save:hover {
        background-color: #4d3827;
      }
    </style>
  </head>
  <body>
    <div class="modal-container">
      <div class="modal-header">Thêm sản phẩm mới</div>

      <form id="productForm">
        <div class="modal-body">
          <div class="column-left">
            <label>Hình ảnh sản phẩm</label>
            <div
              class="upload-area"
              onclick="document.getElementById('imgInput').click()"
            >
              <svg
                width="50"
                height="50"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#a68b7c"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                id="camIcon"
              >
                <path
                  d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                ></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
              <img src="#" id="previewImage" />
              <p
                id="uploadText"
                style="
                  font-size: 13px;
                  color: var(--coffee-border);
                  margin-top: 10px;
                "
              >
                Nhấn để thêm ảnh
              </p>
            </div>
            <input
              type="file"
              id="imgInput"
              hidden
              accept="image/*"
              onchange="previewFile(event)"
            />

            <div style="margin-top: 22px">
              <label>Tên sản phẩm</label>
              <input type="text" placeholder="Ví dụ: Cà phê Muối" />
            </div>
          </div>

          <div class="column-right">
            <div class="form-group">
              <label>Loại sản phẩm</label>
              <select id="category">
                <option value="" disabled selected>
                  📂 Chọn loại sản phẩm
                </option>
              </select>
            </div>
            <div class="form-group" style="margin-top: 15px">
              <label>Giá bán (vnđ)</label>
              <input type="text" placeholder="Ví dụ: 35.000" />
            </div>
            <div class="form-group" style="margin-top: 15px">
              <label>Mô tả chi tiết</label>
              <textarea placeholder="Nhập hương vị, thành phần..."></textarea>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel">
            <span class="close-icon"></span> Huỷ bỏ
          </button>
          <button type="submit" class="btn-save">
            <span>✔️</span> Lưu sản phẩm
          </button>
        </div>
      </form>
    </div>

    <script>
      const categories = [
        { name: "Cà phê truyền thống", icon: "☕" },
        { name: "Trà & Trái cây", icon: "🍵" },
        { name: "Bánh & Tráng miệng", icon: "🍰" },
        { name: "Đồ uống đá xay", icon: "🍧" },
      ];

      window.onload = function () {
        const select = document.getElementById("category");
        categories.forEach((item) => {
          let option = document.createElement("option");
          option.value = item.name;
          option.text = `${item.icon} ${item.name}`;
          select.appendChild(option);
        });
      };

      function previewFile(event) {
        const file = event.target.files[0];
        const preview = document.getElementById("previewImage");
        const camIcon = document.getElementById("camIcon");
        const text = document.getElementById("uploadText");

        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            preview.src = e.target.result;
            preview.style.display = "block";
            camIcon.style.display = "none";
            text.style.display = "none";
          };
          reader.readAsDataURL(file);
        }
      }
    </script>
  </body>
</html>
