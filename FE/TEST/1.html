<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../TEST/1.css" />
  </head>
  <body>
    <div class="modal-container">
      <div class="modal-header">Thêm sản phẩm mới</div>

      <form id="productForm">
        <div class="modal-body">
          <div class="column-left">
            <label>Hình ảnh sản phẩm</label>
            <div
              class="upload-area"
              onclick="document.getElementById('imgInput').click()"
            >
              <svg
                width="50"
                height="50"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#a68b7c"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                id="camIcon"
              >
                <path
                  d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                ></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
              <img src="#" id="previewImage" />
              <p
                id="uploadText"
                style="
                  font-size: 13px;
                  color: var(--coffee-border);
                  margin-top: 10px;
                "
              >
                Nhấn để thêm ảnh
              </p>
            </div>
            <input
              type="file"
              id="imgInput"
              hidden
              accept="image/*"
              onchange="previewFile(event)"
            />

            <div style="margin-top: 22px">
              <label>Tên sản phẩm</label>
              <input type="text" placeholder="Ví dụ: Cà phê Muối" />
            </div>
          </div>

          <div class="column-right">
            <div class="form-group">
              <label>Loại sản phẩm</label>
              <select id="category">
                <option value="" disabled selected>
                  📂 Chọn loại sản phẩm
                </option>
              </select>
            </div>

            <div class="form-group" style="margin-top: 15px">
              <label>Công thức pha chế</label>
              <select id="recipe">
                <option value="" disabled selected>📜 Chọn công thức</option>
                <option value="1">Công thức chuẩn (mặc định)</option>
                <option value="2">Công thức ít đường</option>
                <option value="3">Công thức đặc biệt</option>
              </select>
            </div>

            <div class="form-group" style="margin-top: 15px">
              <label>Giá bán (vnđ)</label>
              <input type="text" placeholder="Ví dụ: 35.000" />
            </div>

            <div class="form-group" style="margin-top: 15px">
              <label>Mô tả chi tiết</label>
              <textarea placeholder="Nhập hương vị, thành phần..."></textarea>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="cancelBtn">
            <span class="close-icon"></span> Huỷ bỏ
          </button>
          <button type="submit" class="btn-save" id="saveBtn">
            <span>✔️</span> Lưu sản phẩm
          </button>
        </div>
      </form>
    </div>

    <script src="../TEST/1.js"></script>
    <script>
      function closeAddProductModal() {
        if (
          window.parent &&
          typeof window.parent.closeAddProduct === "function"
        ) {
          window.parent.closeAddProduct();
          return;
        }
        if (window.close) {
          window.close();
        }
      }

      document
        .getElementById("cancelBtn")
        .addEventListener("click", function (event) {
          event.preventDefault();
          closeAddProductModal();
        });

      document
        .getElementById("productForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          console.log("Lưu sản phẩm...");
          closeAddProductModal();
        });
    </script>
  </body>
</html>
