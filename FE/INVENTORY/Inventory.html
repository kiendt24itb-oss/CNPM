<link rel="stylesheet" href="../INVENTORY/Inventory.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    
  </head>
  <body>
    <div class="main-content-wrapper">
      <header class="main-header">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Tìm kiếm nguyên liệu..." />
        </div>
        <button class="btn-add">+ THÊM ĐƠN</button>
      </header>

      <div class="scroll-container">
        <div class="dashboard-top">
          <div class="stat-card">
            <i
              class="fas fa-layer-group fa-2x"
              style="color: var(--primary); margin-bottom: 10px"
            ></i>
            <div>
              <p style="font-size: 38px; font-weight: 900">102</p>
              <p style="font-size: 12px; color: var(--secondary)">
                Tổng nguyên liệu
              </p>
            </div>
          </div>
          <div class="stat-card">
            <i
              class="fas fa-exclamation-triangle fa-2x"
              style="color: var(--danger); margin-bottom: 10px"
            ></i>
            <div>
              <p
                style="font-size: 38px; font-weight: 900; color: var(--danger)"
              >
                14
              </p>
              <p style="font-size: 12px; color: var(--secondary)">
                Sắp hết hàng
              </p>
            </div>
          </div>
          <div class="chart-box">
            <h4 style="font-size: 13px; margin-bottom: 10px">
              THỐNG KÊ NHẬP XUẤT
            </h4>
            <div style="height: 80px">
              <svg
                viewBox="0 0 700 100"
                preserveAspectRatio="none"
                style="width: 100%; height: 100%"
              >
                <line
                  x1="0"
                  y1="70"
                  x2="700"
                  y2="70"
                  stroke="var(--secondary)"
                  stroke-width="2"
                  stroke-dasharray="5"
                />
                <path
                  d="M0,85 Q100,20 250,55 T450,35 T700,65"
                  fill="none"
                  stroke="var(--primary)"
                  stroke-width="4"
                />
                <circle cx="110" cy="25" r="5" fill="var(--primary)" />
                <circle cx="455" cy="35" r="5" fill="var(--primary)" />
              </svg>
            </div>
          </div>
        </div>

        <div class="table-card">
          <div class="table-title"><h2>DANH SÁCH NGUYÊN LIỆU</h2></div>
          <table>
            <thead>
              <tr>
                <th>Mã ID</th>
                <th>Tên Nguyên Liệu</th>
                <th>Nhà Cung Cấp</th>
                <th>Đơn Vị</th>
                <th>Số Lượng</th>
                <th>Tối Thiểu</th>
                <th>Trạng Thái</th>
                <th>Xem</th>
              </tr>
            </thead>
            <tbody id="list-data"></tbody>
          </table>
        </div>
        <div style="height: 100px"></div>
      </div>
    </div>

    <script src="../INVENTORY/Inventory.js"></script>
