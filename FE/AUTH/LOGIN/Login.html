<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập Nội bộ - CoffeeManager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              coffee: {
                50: "#faf6f3",
                100: "#f0e6de",
                200: "#e0ccbd",
                300: "#c9a88f",
                400: "#b08560",
                500: "#8b6914",
                600: "#5D4037",
                700: "#4E342E",
                800: "#3E2723",
                900: "#2d1f1a",
              },
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      video::-webkit-media-controls {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-stone-50">
    <div class="flex min-h-screen">
      <div class="relative hidden flex-1 lg:flex overflow-hidden">
        <video
          autoplay
          loop
          muted
          playsinline
          class="absolute inset-0 h-full w-full object-cover scale-105"
        >
          <source src="../../ASSETS/VIDEOS/coffe.mp4" type="video/mp4" />
        </video>
        <div
          class="absolute inset-0 bg-gradient-to-br from-coffee-800/70 via-coffee-700/60 to-coffee-900/80"
        ></div>
        <div
          class="relative z-10 flex flex-col items-center justify-center p-10 text-white w-full"
        >
          <img
            src="https://cdn-icons-png.flaticon.com/512/924/924514.png"
            alt="Logo"
            class="mb-4 w-20 h-20 object-contain drop-shadow-[0_5px_15px_rgba(255,255,255,0.3)]"
          />
          <h1 class="mb-4 text-4xl font-bold drop-shadow-lg">CoffeeManager</h1>
          <p
            class="max-w-xs text-center text-base leading-relaxed opacity-90 drop-shadow-md"
          >
            Hệ thống quản lý nội bộ dành riêng cho nhân viên và quản lý.
          </p>
        </div>
      </div>

      <div
        class="flex flex-1 items-center justify-center bg-gradient-to-br from-stone-50 to-coffee-50 p-6 lg:p-10"
      >
        <div class="w-full max-w-md">
          <div class="mb-8">
            <h1 class="mb-2 text-3xl font-bold text-coffee-800">
              Chào mừng trở lại!
            </h1>
            <p class="text-coffee-600">
              Đăng nhập bằng tài khoản nội bộ được cấp.
            </p>
          </div>

          <form id="loginForm" class="space-y-5">
            <div class="space-y-2">
              <label for="email" class="text-sm font-medium text-coffee-800"
                >Email</label
              >
              <input
                id="email"
                type="email"
                placeholder="Nhập email của bạn"
                required
                class="w-full h-12 px-4 rounded-xl border-2 border-coffee-200 bg-white focus:border-coffee-600 focus:outline-none focus:ring-2 focus:ring-coffee-600/20 transition-all"
              />
            </div>

            <div class="space-y-2">
              <label for="password" class="text-sm font-medium text-coffee-800"
                >Mật khẩu</label
              >
              <div class="relative">
                <input
                  id="password"
                  type="password"
                  placeholder="Nhập mật khẩu"
                  required
                  class="w-full h-12 px-4 pr-12 rounded-xl border-2 border-coffee-200 bg-white focus:border-coffee-600 focus:outline-none focus:ring-2 focus:ring-coffee-600/20 transition-all"
                />
                <button
                  type="button"
                  onclick="togglePassword()"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-coffee-400 hover:text-coffee-600"
                >
                  <svg
                    id="eyeIcon"
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <input
                  id="remember"
                  type="checkbox"
                  class="w-4 h-4 rounded border-coffee-400 text-coffee-600 focus:ring-coffee-600 cursor-pointer accent-coffee-600"
                />
                <label
                  for="remember"
                  class="cursor-pointer text-sm text-coffee-700"
                  >Ghi nhớ đăng nhập</label
                >
              </div>
              <a
                href="#"
                class="text-sm font-medium text-coffee-600 transition-colors hover:text-coffee-800 hover:underline"
                >Quên mật khẩu?</a
              >
            </div>

            <button
              type="submit"
              class="w-full h-12 rounded-xl bg-coffee-600 text-white text-base font-semibold transition-all hover:bg-coffee-700 hover:shadow-lg hover:shadow-coffee-600/30 cursor-pointer"
            >
              Đăng nhập ngay
            </button>
          </form>

          <div class="mt-12 text-center">
            <p
              class="text-xs text-coffee-400 uppercase tracking-widest leading-loose border-t border-coffee-100 pt-6"
            >
              © 2026 CoffeeManager Management System <br />
              Liên hệ Admin nếu bạn chưa có tài khoản.
            </p>
          </div>
        </div>
      </div>
    </div>

    <div
      id="toast"
      class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50"
    >
      <div
        class="bg-white rounded-xl shadow-xl border border-coffee-100 p-4 min-w-[300px]"
      >
        <h4 id="toastTitle" class="font-semibold text-coffee-800 mb-1"></h4>
        <p id="toastDesc" class="text-sm text-coffee-600"></p>
      </div>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        passwordInput.type =
          passwordInput.type === "password" ? "text" : "password";
      }
    </script>
    <script src="./login.js"></script>
  </body>
</html>
