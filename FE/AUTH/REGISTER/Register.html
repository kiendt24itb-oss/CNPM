<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - CoffeeManager</title>
    <meta name="description" content="Đăng ký tài khoản CoffeeManager" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              coffee: {
                50: "#faf6f3",
                100: "#f0e6de",
                200: "#e0ccbd",
                300: "#c9a88f",
                400: "#b08560",
                500: "#8b6914",
                600: "#5D4037",
                700: "#4E342E",
                800: "#3E2723",
                900: "#2d1f1a",
              },
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }

      video::-webkit-media-controls {
        display: none !important;
      }
      video::-webkit-media-controls-enclosure {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-stone-50">
    <div class="flex min-h-screen">
      <!-- Left Side - Video Background -->
      <div class="relative hidden flex-1 lg:flex overflow-hidden">
        <video
          autoplay
          loop
          muted
          playsinline
          class="absolute inset-0 h-full w-full object-cover scale-105"
        >
          <source src="../../ASSETS/VIDEOS/coffe.mp4" type="video/mp4" />
        </video>

        <div
          class="absolute inset-0 bg-gradient-to-br from-coffee-800/70 via-coffee-700/60 to-coffee-900/80"
        ></div>

        <div
          class="relative z-10 flex flex-col items-center justify-center p-10 text-white w-full"
        >
          <img
            src="https://cdn-icons-png.flaticon.com/512/924/924514.png"
            alt="Coffee Logo"
            class="mb-4 w-20 h-20 object-contain drop-shadow-[0_5px_15px_rgba(255,255,255,0.3)]"
          />
          <h1 class="mb-4 text-4xl font-bold drop-shadow-lg">CoffeeManager</h1>
          <p
            class="max-w-xs text-center text-base leading-relaxed opacity-90 drop-shadow-md"
          >
            Hệ thống quản lý quán cà phê chuyên nghiệp, giúp bạn vận hành hiệu
            quả hơn
          </p>
        </div>
      </div>

      <!-- Right Side - Register Form -->
      <div
        class="flex flex-1 items-center justify-center bg-gradient-to-br from-stone-50 to-coffee-50 p-6 lg:p-10"
      >
        <div class="w-full max-w-md">
          <!-- Header -->
          <div class="mb-6">
            <h1 class="mb-2 text-3xl font-bold text-coffee-800">
              Tạo tài khoản mới
            </h1>
            <p class="text-coffee-600">
              Đăng ký để bắt đầu quản lý quán của bạn
            </p>
          </div>

          <!-- Form -->
          <form id="registerForm" class="space-y-4">
            <div class="space-y-2">
              <label for="email" class="text-sm font-medium text-coffee-800">
                Email
              </label>
              <input
                id="email"
                type="email"
                placeholder="Nhập email của bạn"
                required
                class="w-full h-12 px-4 rounded-xl border-2 border-coffee-200 bg-white focus:border-coffee-600 focus:outline-none focus:ring-2 focus:ring-coffee-600/20 transition-all"
              />
            </div>

            <div class="space-y-2">
              <label for="fullName" class="text-sm font-medium text-coffee-800">
                Họ và tên
              </label>
              <input
                id="fullName"
                type="text"
                placeholder="Nhập họ tên"
                required
                class="w-full h-12 px-4 rounded-xl border-2 border-coffee-200 bg-white focus:border-coffee-600 focus:outline-none focus:ring-2 focus:ring-coffee-600/20 transition-all"
              />
            </div>

            <div class="space-y-2">
              <label for="password" class="text-sm font-medium text-coffee-800">
                Mật khẩu
              </label>
              <div class="relative">
                <input
                  id="password"
                  type="password"
                  placeholder="Nhập mật khẩu"
                  required
                  class="w-full h-12 px-4 pr-12 rounded-xl border-2 border-coffee-200 bg-white focus:border-coffee-600 focus:outline-none focus:ring-2 focus:ring-coffee-600/20 transition-all"
                />
                <button
                  type="button"
                  onclick="togglePassword('password', 'eyeIcon1')"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-coffee-400 hover:text-coffee-600 transition-colors"
                >
                  <svg
                    id="eyeIcon1"
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div class="space-y-2">
              <label
                for="confirmPassword"
                class="text-sm font-medium text-coffee-800"
              >
                Xác nhận mật khẩu
              </label>
              <div class="relative">
                <input
                  id="confirmPassword"
                  type="password"
                  placeholder="Nhập lại mật khẩu"
                  required
                  class="w-full h-12 px-4 pr-12 rounded-xl border-2 border-coffee-200 bg-white focus:border-coffee-600 focus:outline-none focus:ring-2 focus:ring-coffee-600/20 transition-all"
                />
                <button
                  type="button"
                  onclick="togglePassword('confirmPassword', 'eyeIcon2')"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-coffee-400 hover:text-coffee-600 transition-colors"
                >
                  <svg
                    id="eyeIcon2"
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Role Selection -->
            <div class="space-y-3">
              <label class="text-sm font-medium text-coffee-800">
                Chọn vai trò
              </label>
              <div class="grid grid-cols-2 gap-3">
                <label class="relative cursor-pointer">
                  <input
                    type="radio"
                    name="role"
                    value="admin"
                    class="peer sr-only"
                    required
                  />
                  <div
                    class="flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-coffee-200 bg-white transition-all peer-checked:border-coffee-600 peer-checked:bg-coffee-50 hover:border-coffee-300"
                  >
                    <div
                      class="w-12 h-12 flex items-center justify-center rounded-full bg-coffee-100"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-6 h-6 text-coffee-600"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
                        />
                      </svg>
                    </div>
                    <span class="font-medium text-coffee-800">Quản lí</span>
                    <span class="text-xs text-coffee-500 text-center"
                      >Quản lý toàn bộ hệ thống</span
                    >
                  </div>
                  <div
                    class="absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-coffee-300 peer-checked:border-coffee-600 peer-checked:bg-coffee-600 flex items-center justify-center"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="w-3 h-3 text-white hidden peer-checked:block"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="3"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M5 13l4 4L19 7"
                      />
                    </svg>
                  </div>
                </label>

                <label class="relative cursor-pointer">
                  <input
                    type="radio"
                    name="role"
                    value="staff"
                    class="peer sr-only"
                  />
                  <div
                    class="flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-coffee-200 bg-white transition-all peer-checked:border-coffee-600 peer-checked:bg-coffee-50 hover:border-coffee-300"
                  >
                    <div
                      class="w-12 h-12 flex items-center justify-center rounded-full bg-coffee-100"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-6 h-6 text-coffee-600"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                        />
                      </svg>
                    </div>
                    <span class="font-medium text-coffee-800">Nhân viên</span>
                    <span class="text-xs text-coffee-500 text-center"
                      >Thao tác cơ bản</span
                    >
                  </div>
                  <div
                    class="absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-coffee-300 peer-checked:border-coffee-600 peer-checked:bg-coffee-600 flex items-center justify-center"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="w-3 h-3 text-white hidden peer-checked:block"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="3"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M5 13l4 4L19 7"
                      />
                    </svg>
                  </div>
                </label>
              </div>
            </div>

            <button
              type="submit"
              class="w-full h-12 rounded-xl bg-coffee-600 text-white text-base font-semibold transition-all hover:bg-coffee-700 hover:shadow-lg hover:shadow-coffee-600/30 cursor-pointer mt-2"
            >
              Đăng ký
            </button>
          </form>

          <!-- Login Link -->
          <p class="mt-6 text-center text-sm text-coffee-600">
            Đã có tài khoản?
            <a
              href="../LOGIN/login.html"
              class="font-semibold text-coffee-700 transition-colors hover:text-coffee-800 hover:underline"
            >
              Đăng nhập ngay
            </a>
          </p>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div
      id="toast"
      class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50"
    >
      <div
        class="bg-white rounded-xl shadow-xl border border-coffee-100 p-4 min-w-[300px]"
      >
        <h4 id="toastTitle" class="font-semibold text-coffee-800 mb-1"></h4>
        <p id="toastDesc" class="text-sm text-coffee-600"></p>
      </div>
    </div>

    <script src="../REGISTER/Register.js"></script>
  </body>
</html>
