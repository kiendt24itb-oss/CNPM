<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Quản Lý Quán Cà Phê</title>

    <!-- ChartJS (dùng sau) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="../MENU/Menu.css" />
  </head>

  <body>
    <div class="sidebar">
      <div class="logo">
        <span>☕</span>
        <span>CoffeeManager</span>
      </div>

      <div class="menu-section">
        <div class="menu-title">QUẢN LÝ</div>

        <div class="menu-item active" data-page="../HOME/Home.html">
          <span>📊</span><span>Trang chủ</span>
        </div>

        <div class="menu-item" data-page="../TABLE/Table.html">
          <span>🪑</span><span>Bàn</span>
        </div>

        <div class="menu-item" data-page="../ORDER/Order.html">
          <span>📋</span><span>Đơn hàng</span>
          <span class="badge">5</span>
        </div>

        <div class="menu-item" data-page="../MENU/Menu.html">
          <span>🍹</span><span>Menu</span>
        </div>

        <div class="menu-item" data-page="../INVENTORY/Inventory.html">
          <span>📦</span><span>Kho</span>
        </div>

        <div class="menu-item" data-page="../STAFF/Staff.html">
          <span>👥</span><span>Nhân viên</span>
        </div>
      </div>

      <div class="menu-section">
        <div class="menu-title">HỆ THỐNG</div>

        <div class="menu-item logout-item" onclick="handleLogout()">
          <span>🚪</span><span>Thoát</span>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="header">
        <div>
          <h2>Chào mừng trở lại, Admin!</h2>
          <p style="color: var(--text-light); font-size: 14px">
            Hôm nay là thứ Ba, 15/01/2024
          </p>
        </div>

        <div class="user-display">
          <div class="user-info-static">
            <div class="avatar">A</div>
            <div>
              <div style="font-weight: 600">Quản trị viên</div>
              <div style="font-size: 12px; color: var(--text-light)">
                Trực tuyến
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="content"></div>
    </div>

    <script src="index.js"></script>
    <script>
      function handleLogout() {
        if (confirm("Bạn có chắc chắn muốn đăng xuất?")) {
          window.location.href = "login.html"; // Thay đường dẫn trang đăng nhập của bạn vào đây
        }
      }
    </script>
  </body>
</html>
